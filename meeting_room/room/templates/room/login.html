{% extends 'room/base.html' %}

{% block title %}
<title>Login</title>
{% endblock %}

{% block content %}
<div class="container mt-5 d-flex justify-content-center">
    <div class="card shadow-lg p-4" style="width: 400px; background: #f8f9fa;">
        <h3 class="text-center mb-4" style="color: black;">เข้าสู่ระบบ</h3>
        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            <div class="mb-3">
                <label for="username" class="form-label">ชื่อผู้ใช้</label>
                <input type="text" name="username" class="form-control" id="username" placeholder="กรอกชื่อผู้ใช้" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">รหัสผ่าน</label>
                <input type="password" name="password" class="form-control" id="password" placeholder="กรอกรหัสผ่าน" required>
            </div>
            {% if messages %}
            <div class="alert alert-danger" role="alert">
                {% for message in messages %}
                    {{ message }}
                {% endfor %}
            </div>
            {% endif %}
            <div class="d-grid">
                <button type="submit" class="btn btn-primary">เข้าสู่ระบบ</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
