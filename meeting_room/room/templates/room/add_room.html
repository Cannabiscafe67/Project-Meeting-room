{% extends 'room/base.html' %}

{% block content %}
<style>
    @import url("https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css");
    @import url('https://fonts.googleapis.com/css2?family=Itim&display=swap');
    * {
        font-family: "Itim", cursive;
        font-weight: 400;
        font-style: normal;
    }
    body {
        background-color: black;
        margin: 0;
    }
    input[type=text], input[type=date], select {
        width: 100%;
        padding: 12px 20px;
        margin: auto;
        display: inline-block;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
        background-color: white;
    }
    .container {
        display: flex;
        justify-content: center;
    }
    button[type=submit], .btn-secondary {
        width: 48%;
        padding: 14px 20px;
        margin: auto;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }
    button[type=submit] {
        background-color: #fd01fd;
        color: white;
    }
    .btn-secondary {
        background-color: #6c757d;
        color: white;
    }
    .login-box {
        background-color: white;
        border-radius: 10px;
        padding: 20px;
        margin: auto;
        width: 500px;
    }
    h3 {
        text-align: center;
        color: black;
    }
</style>

<body>
<br><br><br>
<div>
    <div class="login-box">
        <h3>จองห้องประชุม</h3>
        <br>
        <form method="POST">
            {% csrf_token %}

            <label for="name" class="form-label">ชื่อ - นามสกุล</label>
            <input type="text" name="name" placeholder="กรุณากรอกชื่อ" required>
            <br><br>

            <label for="room" class="form-label">เลือกห้อง</label>
            <select name="room" class="form-select" required> 
                <option value="C01">C01</option>
                <option value="C02">C02</option>
                <option value="C03">C03</option>
                <option value="C04">C04</option>
                <option value="C05">C05</option>
                <option value="C06">C06</option>
                <option value="C07">C07</option>
                <option value="C08">C08</option>
                <option value="C09">C09</option>
                <option value="C10">C10</option>
            </select>
            <br><br>

            <label for="date" class="form-label">วันที่จอง</label>
            <input type="date" name="date" class="form-control" required>
            <br><br>

            <label for="start_time" class="form-label">เวลาเริ่ม</label>
            <input type="time" name="start_time" class="form-control" required>
            <br>
            
            <label for="end_time" class="form-label">เวลาสิ้นสุด</label>
            <input type="time" name="end_time" class="form-control" required>
            <br>

            <div class="d-flex justify-content-between">
                <button type="submit" class="btn btn-success">บันทึกการจอง</button>
                <a href="{% url 'home' %}" class="btn btn-secondary">ย้อนกลับ</a>
            </div>
        </form>
    </div>
</div>
</body>
{% endblock %}
